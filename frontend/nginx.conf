server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las copias de seguridad .xlsx se suben por aqui; el limite por defecto
    # de nginx (1 MB) se queda corto en cuanto hay unos cuantos movimientos.
    client_max_body_size 25m;

    # El navegador llama a /api/... y nginx lo reenvia al backend por la red
    # interna de Docker. Asi el backend no necesita publicar ningun puerto en
    # la maquina y todo el sistema se sirve por un unico puerto.
    #
    # La barra final de proxy_pass es significativa: hace que /api/transactions
    # llegue al backend como /transactions.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los ficheros de /assets llevan un hash en el nombre: si cambia el
    # contenido cambia el nombre, asi que se pueden cachear indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html NO se cachea: es quien apunta al bundle con hash. Si el
    # navegador se queda con una copia vieja, sigue pidiendo el JS anterior
    # y la aplicacion parece no haberse actualizado tras un despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
